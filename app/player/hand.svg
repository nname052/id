<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -170 1040 360" width="1040" height="360">
  <!-- إيد ماسكة قلم ماركر (رسمتنا، مش من مكتبة). سن القلم عند (0,0) والقلم ماشي ناحية +x،
       والمشغّل بيلف الرسمة كلها علشان الإيد تيجي من تحت على اليمين زي فيديوهات السبورة. -->
  <g stroke="#2a1d17" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- الدراع والكم -->
    <path d="M520 -95 C640 -110 820 -120 1020 -105 L1020 175 C820 180 650 170 540 140 Z" fill="#3d6fb6"/>
    <path d="M520 -95 C560 -40 565 90 540 140" fill="none" stroke-width="6"/>
    <path d="M500 -88 C548 -86 560 -40 562 20 C562 80 548 128 520 138 L470 128 C500 80 500 -40 470 -84 Z" fill="#dfe8f5"/>
    <!-- ضهر الإيد والكف -->
    <path d="M255 -86 C330 -128 430 -120 486 -88 C520 -50 522 70 492 118 C430 150 330 140 270 110 C230 80 215 -40 255 -86 Z" fill="#f2c4a0"/>
    <path d="M300 -70 C350 -92 410 -90 450 -70" fill="none" stroke="#d99f7a" stroke-width="4"/>
    <!-- القلم -->
    <path d="M0 0 L46 -15 L46 15 Z" fill="#3a3a3a"/>
    <rect x="44" y="-19" width="300" height="38" rx="9" fill="#1f1f22"/>
    <rect x="300" y="-21" width="34" height="42" rx="6" fill="#d23a35"/>
    <rect x="70" y="-12" width="200" height="7" rx="3" fill="#4a4a50" stroke="none"/>
    <!-- الصباع الكبير (تحت القلم) -->
    <path d="M300 60 C260 66 200 52 160 34 C138 24 140 6 160 4 C200 2 250 14 300 22 Z" fill="#f2c4a0"/>
    <path d="M172 6 C166 14 166 24 174 30" fill="none" stroke="#d99f7a" stroke-width="4"/>
    <!-- السبابة (فوق القلم) -->
    <path d="M330 -60 C280 -78 210 -60 150 -32 C126 -22 126 -6 146 -6 C200 -8 260 -20 320 -18 Z" fill="#f6cdaa"/>
    <path d="M160 -28 C152 -22 152 -12 160 -8" fill="none" stroke="#d99f7a" stroke-width="4"/>
    <path d="M232 -54 C238 -44 238 -34 230 -28" fill="none" stroke="#d99f7a" stroke-width="3.5"/>
    <!-- الصوابع التانية مقفولة جوه الكف -->
    <path d="M330 -20 C300 -6 300 34 330 46 C360 54 380 30 372 6 C366 -14 350 -24 330 -20 Z" fill="#efbd97"/>
    <path d="M360 40 C334 56 340 96 372 104 C404 108 418 80 408 58 C400 42 382 34 360 40 Z" fill="#efbd97"/>
  </g>
</svg>
