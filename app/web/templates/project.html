{% extends "base.html" %}
{% block title %}المشروع{% endblock %}
{% block body %}
<div class="row" style="margin-bottom:var(--s2)">
  <h1 id="title" class="grow" style="margin:0">…</h1>
  <button id="rename">✎ تغيير العنوان</button>
</div>
<div id="renameBox" hidden></div>
<div class="muted" id="sub" style="margin-bottom:var(--s4)"></div>
<div class="stages" id="stages"></div>
<div class="layout">
  <div class="card" id="panel"><span class="spinner"></span></div>
  <div class="phone" id="phone"><div class="empty">المعاينة هتظهر هنا بعد ما المشاهد تجهز</div></div>
</div>
<details class="log card"><summary class="muted">تفاصيل (السجل والاستهلاك)</summary><div id="usage" class="muted"></div><pre id="log"></pre></details>
{% endblock %}
{% block script %}
<script>
  // إعادة جملة: لو تكلفتها أكتر من حد الموافقة (صفحة الإعدادات)، السيرفر بيرجّع needs_confirm ومش بيبعت حاجة لـ ElevenLabs لحد ما توافق
  async function regenSentence(sid) {
    let r = await api(`/api/projects/${PID}/audio/sentence/${sid}`, { method: "POST", body: {} });
    if (r && r.needs_confirm) {
      if (!confirm(r.message)) return;
      r = await api(`/api/projects/${PID}/audio/sentence/${sid}`, { method: "POST", body: { confirm: true } });
    }
    return r;
  }
  const PID = "{{ pid }}";
  let P = null, lastKey = "", dirty = false, phoneKey = "";
  let VIEW = null; // مرحلة فاتحها بإيدك علشان تعدّلها (غير المرحلة الحالية)

  const busy = (txt) => `<div class="row"><span class="spinner"></span><b>${esc(txt)}</b></div>`;
  const RUNNING_TEXT = { script: "بنكتب السكريبت…", scenes: "بنخطط المشاهد وبندوّر في المكتبات…", tts: "بنجهّز النص للنطق…",
    audio: "ElevenLabs بيولّد الصوت…", render: "بنصدّر الفيديو…", audio_sentence: "بنعيد الجملة…", audio_review: "بنراجع النطق…",
    brief: "بنكتب الرؤية الإخراجية…", edit_script: "بنعدّل الجزء اللي غيّرته بس (النطق، والصوت، والمشاهد)…",
    edit_tts: "بنعيد صوت الجمل اللي عدّلتها بس…", edit_scene: "بنعدّل المشهد ده بس…",
    audio_user: "بنظبط توقيت كل كلمة على صوتك…" };

  // المرحلة اللي محتاجة انتباهك دلوقتي
  function current(p) {
    const order = ["script", "tts", "brief", "scenes", "audio", "render"];
    return order.find((s) => ["running", "queued", "review", "failed", "waiting_limit", "needs_credits", "needs_voice"].includes(p.stages[s].status))
      || (p.status === "done" ? "done" : order.find((s) => p.stages[s].status !== "approved") || "done");
  }

  function header(p) {
    $("#title").textContent = p.title || p.prompt;
    const TYPE = { whiteboard: "✍️ سبورة بيضاء", regular: "📱 فيديو عادي", "3d": "🎬 3D" }[p.settings.video_type || "regular"];
    $("#sub").textContent = `${TYPE} · ${p.prompt} · ${p.settings.duration} ثانية · ${p.settings.voice_name || ""}`;
    $("#stages").innerHTML = Object.entries(STAGE_NAMES).map(([k, n]) => {
      const st = p.stages[k].status, open = VIEW === k ? " open" : "";
      return `<button type="button" class="stage ${st}${open}" data-view="${k}" title="افتح المرحلة دي علشان تشوفها أو تعدّلها">${n}${STATUS_NAMES[st] ? " · " + STATUS_NAMES[st] : ""}</button>`; }).join("");
    const u = p.usage || {}, el = u.elevenlabs || {};
    $("#usage").innerHTML = `طلبات الذكاء الاصطناعي: ${u.claude_calls || 0} (${Object.entries(u.claude_by_stage || {}).map(([k, v]) => `${k}: ${v}`).join("، ")})` +
      (el.actual != null ? ` · ElevenLabs: متوقع ${el.expected}، فعلي ${el.actual}، متبقي ${el.left}` : "");
    $("#log").textContent = (p.log || []).join("\n");
  }

  function phone(p) {
    const key = p.has_video ? "video" : p.plan ? `player-${p.has_audio}-${p.stages.scenes.status}` : "";
    if (key === phoneKey) return;
    phoneKey = key;
    if (p.has_video) $("#phone").innerHTML = `<video controls playsinline src="/files/${PID}/output/video.mp4?v=${Date.now()}"></video>`;
    else if (p.plan) $("#phone").innerHTML = `<iframe src="/player/player.html?id=${PID}&mode=preview&v=${Date.now()}"></iframe>`;
  }

  function stuck(p, stage) {
    const st = p.stages[stage];
    if (st.status === "failed") return `<div class="note err">حصلت مشكلة: ${esc(st.error)}</div><div class="actions"><button class="primary" data-act="resume">↻ حاول تاني</button></div>`;
    if (st.status === "waiting_limit") {
      const at = p.resets_at ? new Date(p.resets_at * 1000).toLocaleTimeString("ar-EG", { hour: "numeric", minute: "2-digit" }) : "";
      return `<div class="note warn">وقفنا لأنك وصلت لحد استخدام الذكاء الاصطناعي${at ? `، وبيتجدد الساعة ${at}` : ""}. كل اللي اتعمل محفوظ.</div><div class="actions"><button class="primary" data-act="resume">كمّل</button></div>`;
    }
    if (st.status === "needs_credits") return `<div class="note warn">${esc(st.error)}</div><div class="actions"><button class="primary" data-act="resume">موافق، كمّل</button></div>`;
    return null;
  }

  function panel(p) {
    const cur = current(p);
    // لو فيه شغل شغال، بنعرضه هو. غير كده لو فاتح مرحلة بإيدك بنعرضها للتعديل
    const busyNow = ["running", "queued"].includes((p.stages[cur] || {}).status);
    if (busyNow) VIEW = null;
    const s = VIEW && p.stages[VIEW] && p.stages[VIEW].status !== "pending" ? VIEW : cur, st = p.stages[s] || {};
    const EDIT = s !== cur && ["approved", "stale"].includes(st.status);
    const k = `${s}:${EDIT}:${st.status}:${p.has_video}:${JSON.stringify(st.progress || "")}:${p.notice || ""}:${JSON.stringify(p.review || "")}:${p.can_undo}`;
    if (k === lastKey || (dirty && (st.status === "review" || EDIT))) return;
    lastKey = k; dirty = false;
    const el = $("#panel");
    const notice = p.notice ? `<div class="note warn">${esc(p.notice)}</div>` : "";
    if (s === "done") { el.innerHTML = notice + doneHTML(p); return; }
    const blocked = stuck(p, s);
    if (blocked) { el.innerHTML = `<h2>${STAGE_NAMES[s]}</h2>` + blocked; return; }
    if (["running", "queued"].includes(st.status)) {
      let extra = "";
      if (s === "render" && st.progress) { const pc = Math.round((st.progress.done / st.progress.total) * 100); extra = `<div class="progress"><div style="width:${pc}%"></div></div><div class="muted">فريم ${st.progress.done} من ${st.progress.total}</div>`; }
      if (s === "audio" && p.audio_cost) extra = `<div class="muted">هيستهلك حوالي ${p.audio_cost} credit</div>`;
      el.innerHTML = `<h2>${STAGE_NAMES[s]}</h2>` + busy(RUNNING_TEXT[st.job] || RUNNING_TEXT[s]) + extra;
      return;
    }
    const back = EDIT ? `<div class="note">بتعدّل مرحلة خلصت: هيتعدّل الجزء اللي غيّرته بس، والباقي زي ما هو. <button data-act="close-view">↩ رجوع</button></div>` : "";
    if (s === "script") el.innerHTML = back + scriptHTML(p, EDIT);
    else if (s === "tts") el.innerHTML = back + ttsHTML(p, EDIT);
    else if (s === "brief") el.innerHTML = back + briefHTML(p);
    else if (s === "scenes") el.innerHTML = back + scenesHTML(p, EDIT);
    else if (s === "audio" && st.status === "needs_voice") el.innerHTML = notice + recordHTML(p);
    else if (s === "audio") el.innerHTML = notice + audioHTML(p);
    else if (s === "render") el.innerHTML = notice + `<h2>${STAGE_NAMES.render}</h2><div class="muted">${st.status === "stale" ? "فيه تعديلات لسه ما ظهرتش في الفيديو." : ""}</div>
      <div class="actions"><button class="primary" data-act="regen" data-stage="render">⬇ صدّر الفيديو</button></div>`;
    else el.innerHTML = `<h2>${STAGE_NAMES[s]}</h2><div class="actions"><button class="primary" data-act="approve" data-stage="${s}">كمّل</button></div>`;
  }

  const sentRow = (s, i) => `<div class="s" data-id="${s.id ?? ""}"><span class="n">${i + 1}</span><textarea rows="1" class="sent">${esc(s.text)}</textarea>
    <button class="mini" data-act="add-sent" title="جملة جديدة بعد دي">＋ جملة</button><button class="mini" data-act="del-sent" title="شيل الجملة">✕ شيل</button></div>`;
  function scriptHTML(p, edit) {
    const sc = p.script || { sentences: [] };
    const words = sc.sentences.reduce((n, s) => n + s.text.split(/\s+/).length, 0);
    const notes = (sc.notes || []).length ? `<div class="note ok">ظبطت سكريبتك: ${sc.notes.map(esc).join("، ")}</div>` : "";
    return `<h2>${STAGE_NAMES.script}</h2>${notes}
      <div class="muted">${sc.sentences.length} جملة · ${words} كلمة · حوالي ${Math.round(words / 2.2)} ثانية. عدّل أي كلمة، أو زوّد/شيل جملة.</div>
      <div class="sentences" style="margin-top:var(--s3)">${sc.sentences.map(sentRow).join("")}</div>
      <div class="actions">${edit
        ? `<button class="primary" data-act="save-script">💾 احفظ (هيتعدّل اللي غيّرته بس)</button>`
        : `<button class="primary" data-act="approve" data-stage="script">✓ موافق، جهّز الإحساس والنطق</button>
        <input type="text" id="instr" class="grow" placeholder="أو اطلب تعديل: خليه أقصر، الهوك أقوى، أكتر هزار…">
        <button data-act="regen" data-stage="script">↻ اكتب تاني</button>`}
      </div>`;
  }
  // نص النطق: الكلام زي ما هيتقال بالـ tags والترقيم (زي Enhance في ElevenLabs). تقدر تعدّل أي tag أو تضيف همس/ضحكة…
  function ttsHTML(p, edit) {
    const lines = (p.tts || { lines: [] }).lines;
    const show = (t) => esc(t).replace(/\[([^\]]+)\]/g, '<span class="tag">$1</span>');
    return `<h2>${STAGE_NAMES.tts}</h2>
      <div class="muted">ده الكلام زي ما الصوت هيقوله. الإحساس بين [ ] بالإنجليزي، وبيتحط بس لما الجملة نفسها شايلاه: [laughs] للنكتة، [whispers] للسر، [sighs] للتعب، [curious] للسؤال (مش في المواضيع الجد)، وأغلب الجمل من غير tag. و "?" للسؤال، و "..." للتردد. عدّل أي سطر براحتك من غير ما تغيّر الكلمات (الـ tag لازم من قايمة ElevenLabs).</div>
      <div class="sentences tts-edit" style="margin-top:var(--s3)">${lines.map((l, i) => `<div class="s" data-id="${l.id}"><span class="n">${i + 1}</span>
        <div class="grow"><div class="tts-view">${show(l.tts)}</div><textarea rows="1" class="tts" dir="rtl">${esc(l.tts)}</textarea>
        ${Object.keys(l.pronounce || {}).length ? `<div class="muted">نطق: ${Object.entries(l.pronounce).map(([w, s]) => `${esc(w)} ← ${esc(s)}`).join("، ")}</div>` : ""}</div></div>`).join("")}</div>
      <div class="actions">${edit
        ? `<button class="primary" data-act="save-tts">💾 احفظ (${p.has_audio ? "وهيتعاد صوت الجمل اللي اتغيّرت بس" : "قبل الصوت"})</button>`
        : `<button class="primary" data-act="approve" data-stage="tts">✓ موافق، كمّل للرؤية الإخراجية</button>
        <input type="text" id="instr" class="grow" placeholder="اطلب تعديل: إحساس أكتر، همس في الجملة التالتة، ضحكة في الآخر…">
        <button data-act="regen" data-stage="tts">↻ جهّز تاني</button>`}
      </div>`;
  }

  const STYLE_NAMES = { motion2d: "موشن جرافيك 2D", cinematic2d: "2D سينمائي بشخصيات", "3d": "3D بشخصيات", anime3d: "3D بشكل أنيمي", mixed: "خليط 3D و 2D" };
  // الرؤية الإخراجية: Claude بيقول هيعمل إيه، وإنت توافق أو تطلب تعديل
  function briefHTML(p) {
    const b = p.brief, sents = (p.script || { sentences: [] }).sentences;
    if (!b) return `<h2>${STAGE_NAMES.brief}</h2><div class="muted">لسه ما اتكتبتش.</div>`;
    const sentText = (ids) => ids.map((id) => esc((sents.find((s) => s.id === id) || {}).text || "")).join(" ");
    return `<h2>${STAGE_NAMES.brief}</h2>
      <div class="muted">${p.direction ? `طلب الإخراج بتاعك: «${esc(p.direction)}»` : "ما كتبتش طلب إخراج، فده اقتراحي. وافق أو اطلب تعديل."}</div>
      <div class="note ok" style="margin-top:var(--s3)"><b>${esc(STYLE_NAMES[b.style] || b.style)}</b> · ${esc(b.concept)}</div>
      <div class="brief-grid">
        <div><b>الشكل والإحساس</b><div>${esc(b.look)}</div></div>
        <div><b>الشخصيات</b><div>${esc(b.characters)}</div></div>
        <div><b>الكاميرا والحركة</b><div>${esc(b.camera)}</div></div>
        <div><b>المختلف المرة دي</b><div>${esc(b.different)}</div></div>
      </div>
      <div class="scenes" style="margin-top:var(--s3)">${b.beats.map((x, i) => `<div class="scene-card"><div class="thumb">${i + 1}</div>
        <div class="grow"><div class="muted">${sentText(x.sentence_ids)}</div><div>🎬 ${esc(x.idea)}</div></div></div>`).join("")}</div>
      <div class="actions">
        <button class="primary" data-act="approve" data-stage="brief">✓ موافق، خطط المشاهد</button>
        <input type="text" id="instr" class="grow" placeholder="اطلب تعديل: خليه 3D أنيمي، الشخصية بنت، المشهد التاني في الشارع…">
        <button data-act="regen" data-stage="brief">↻ رؤية تانية</button>
      </div>`;
  }

  // صورة مصغّرة للمشهد (خطة نسخة 2: visuals و items، والقديمة: kind و asset)
  function thumb(sc) {
    const v = (sc.visuals || [])[0] || ((sc.items || []).find((it) => it.visual) || {}).visual || (sc.asset ? { kind: sc.kind, asset: sc.asset } : null);
    if (sc.layout === "scene3d") return "🎬";
    if (sc.layout === "board") { const v = (sc.board || []).find((x) => x.visual); return v ? `<img src="/assets/${esc(v.visual.asset)}">` : "✍️"; }
    if (v && v.kind === "character") return "🧍";
    if (v && v.asset && !String(v.asset).endsWith(".json")) return `<img src="/assets/${esc(v.asset)}">`;
    if (sc.layout === "custom" || sc.kind === "emoji") return "✦";
    if (sc.layout === "stat" || sc.kind === "number") return esc(sc.number_value || "#");
    if (sc.layout === "question") return "؟";
    return "Aa";
  }
  const KIND = { illustration: "رسمة", icon: "أيقونة", emoji: "إيموجي", number: "رقم", text: "كلمة كبيرة",
    hero: "صورة كبيرة", kinetic: "كلام متحرك", split: "نص ونص", stat: "رقم", list: "قايمة", versus: "مقارنة", quote: "اقتباس",
    question: "سؤال", icon_row: "صف أيقونات", card: "كارت", character: "شخصية", custom: "مشهد مبتكر ✦", scene3d: "مشهد 3D 🎬", board: "سبورة ✍️" };
  function identityHTML(plan) {
    const id = plan.identity;
    if (!id) return "";
    return `<div class="muted" style="margin-top:var(--s2)">هوية الفيديو: ${Object.values(id.palette).map((c) => `<span class="swatch" style="background:${c}"></span>`).join("")}
      · خط <b>${esc(id.font_heading)}</b> · خلفية ${esc(id.background)} · انتقال ${esc(id.transition)}</div>`;
  }

  function scenesHTML(p, edit) {
    const plan = p.plan || { scenes: [] }, sents = (p.script || { sentences: [] }).sentences;
    return `<h2>${STAGE_NAMES.scenes}</h2>
      <div class="muted">شغّل المعاينة على الشمال (من غير صوت، والتوقيت تقريبي لحد ما الصوت يتعمل).</div>${identityHTML(plan)}
      <div class="scenes" style="margin-top:var(--s3)">${plan.scenes.map((sc, i) => `<div class="scene-card"><div class="thumb">${thumb(sc)}</div>
        <div class="grow"><div class="hd">${i + 1}. ${esc(sc.headline)}</div>
        <div class="muted">${sc.sentence_ids.map((id) => esc((sents.find((s) => s.id === id) || {}).text || "")).join(" ")}</div>
        <span class="badge">${KIND[sc.layout || sc.kind] || sc.layout || sc.kind}</span>
        ${[...(sc.visuals || []), ...(sc.items || []).map((it) => it.visual).filter(Boolean), ...(sc.asset_name ? [sc] : [])].map((v) => `<span class="badge" dir="ltr">${esc(v.asset_name || "")}</span>`).join(" ")}
        ${sc.board ? `<div class="muted">✍️ ${sc.board.map((x) => esc(x.text || x.value || (x.visual && x.visual.asset_name) || x.kind)).join(" ← ")}</div>` : ""}
        ${sc.scene3d ? `<div class="muted">🎬 ${esc(sc.scene3d.character)} · ${esc(sc.scene3d.set)} · ${esc(sc.scene3d.time)}${sc.scene3d.speaking ? " · 🗣 بتتكلم" : ""}<br>
          ${sc.scene3d.performance ? "🎭 " + sc.scene3d.performance.map((x) => `${esc(x.at_word || "")}: ${esc(x.r_arm)}${x.emote ? " " + esc(x.emote) : ""}`).join(" ← ")
            + "<br>🎥 " + (sc.scene3d.shots || []).map((x) => `${esc(x.type)} ${esc(x.height)} ${esc(x.move)}`).join(" | ")
            : (sc.scene3d.actions || []).map((a) => esc(a.anim)).join(" ← ") + " · كاميرا " + esc(sc.scene3d.camera || "")}</div>` : ""}
        ${sc.custom_brief && sc.layout === "custom" ? `<div class="muted">✦ ${esc(sc.custom_brief)}</div>` : ""}
        <div class="row" style="margin-top:var(--s2)"><button class="mini" data-act="edit-scene" data-scene="${sc.id}">✎ عدّل المشهد ده بس</button></div></div></div>`).join("")}</div>
      <div class="actions">${edit ? "" : `
        <button class="primary" data-act="approve" data-stage="scenes">✓ موافق، اعمل الصوت</button>
        <input type="text" id="instr" class="grow" placeholder="اطلب تعديل للخطة كلها: ألوان أهدى، مشاهد أسرع…">
        <button data-act="regen" data-stage="scenes">↻ خطط تاني</button>`}
      </div>`;
  }

  // صوتك إنت: تسجيل من الموقع أو رفع ملف
  function recordHTML(p) {
    const sents = (p.script || { sentences: [] }).sentences;
    const up = p.settings.voice_source === "upload";
    return `<h2>${STAGE_NAMES.audio}</h2>
      <div class="muted">${up ? "ارفع ملف الصوت" : "سجّل السكريبت بصوتك"}: اقرا بهدوء وبإحساس، وسيب ثانية بين الجمل. الكلام على الشاشة وحركة البق هيتظبطوا على صوتك تلقائي.</div>
      <div class="read-script">${sents.map((s) => `<p>${esc(s.text)}</p>`).join("")}</div>
      <div class="rec-box">
        <button class="primary" id="rec-btn" data-act="rec-toggle">⏺ ابدأ التسجيل</button>
        <span id="rec-time" class="muted"></span>
        <audio id="rec-play" controls hidden></audio>
        <button id="rec-send" data-act="rec-send" hidden>✓ استخدم التسجيل ده</button>
      </div>
      <div class="row" style="margin-top:var(--s3)"><label class="btn">⬆ أو ارفع ملف صوت<input type="file" id="voice-file" accept="audio/*,.m4a,.mp3,.wav" hidden></label></div>`;
  }
  let recorder = null, recChunks = [], recBlob = null, recStart = 0, recTimer = null;
  async function recToggle() {
    if (recorder && recorder.state === "recording") { recorder.stop(); return; }
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    recChunks = []; recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => recChunks.push(e.data);
    recorder.onstop = () => { stream.getTracks().forEach((t) => t.stop()); clearInterval(recTimer);
      recBlob = new Blob(recChunks, { type: recorder.mimeType || "audio/webm" });
      const a = $("#rec-play"); a.src = URL.createObjectURL(recBlob); a.hidden = false; $("#rec-send").hidden = false;
      $("#rec-btn").textContent = "⏺ سجّل تاني"; };
    recorder.start(); recStart = Date.now(); dirty = true;
    $("#rec-btn").textContent = "⏹ وقّف التسجيل"; $("#rec-send").hidden = true; $("#rec-play").hidden = true;
    recTimer = setInterval(() => ($("#rec-time").textContent = `⏺ ${Math.floor((Date.now() - recStart) / 1000)} ثانية`), 300);
  }
  async function sendVoice(blob, name) {
    const fd = new FormData(); fd.append("file", blob, name);
    const r = await fetch(`/api/projects/${PID}/audio/upload`, { method: "POST", body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || "حصلت مشكلة في الرفع");
    dirty = false; lastKey = "";
  }
  $("#panel").addEventListener("change", async (e) => {
    if (e.target.id !== "voice-file" || !e.target.files[0]) return;
    try { await sendVoice(e.target.files[0], e.target.files[0].name); tick(); } catch (err) { alert(err.message); }
  });

  function audioHTML(p) {
    const el = (p.usage || {}).elevenlabs || {}, words = p.words || [], flags = (p.review || {}).flags || {};
    const tts = (p.tts || { lines: [] }).lines;
    // الجملة بتتعاد وسط جملتين قبلها وجملة بعدها (علشان الصوت يفضل نفس الشخصية)، فالتكلفة بتاعتهم كلهم
    const cost = (i) => tts.slice(Math.max(0, i - 2), i + 2).reduce((n, l) => n + l.tts.length + 1, -1);
    const userVoice = p.settings.voice_source && p.settings.voice_source !== "eleven";
    const rows = tts.map((ln, li) => {
      const ws = words.filter((w) => w.sid === ln.id), bad = flags[String(ln.id)] || [];
      const badI = new Set(bad.map((b) => b.i));
      const start = ws.length ? ws[0].start : 0, end = ws.length ? ws[ws.length - 1].end : 0;
      return `<div class="scene-card" style="align-items:flex-start">
        <button class="play-seg" data-a="${start}" data-b="${end}" title="اسمع الجملة">▶ اسمع</button>
        <div class="grow">${ws.map((w) => badI.has(w.i) ? `<b style="color:var(--err)" title="اتسمعت: ${esc((bad.find((b) => b.i === w.i) || {}).heard || "")}">${esc(w.word)}</b>` : esc(w.word)).join(" ")}
          <div class="muted tts-line" title="النص اللي بيروح للصوت: التشكيل والإحساس">🎙 ${esc(ln.tts).replace(/\[([^\]]+)\]/g, '<span class="badge" dir="ltr">$1</span>')}</div>
          ${bad.length ? `<div class="muted" style="color:var(--err)">ممكن تكون اتنطقت غلط: ${bad.map((b) => `«${esc(b.word)}» (اتسمعت «${esc(b.heard || "؟")}»)`).join("، ")}</div>` : ""}
          <div class="row" style="margin-top:var(--s2)">
            <button data-act="fixword" data-sid="${ln.id}" style="padding:4px 10px;font-size:var(--fs-sm)">✎ صلّح نطق كلمة</button>
            ${userVoice ? "" : `<button data-act="regensent" data-sid="${ln.id}" style="padding:4px 10px;font-size:var(--fs-sm)">↻ أعد الجملة (${cost(li)} credit)</button>`}
          </div></div></div>`;
    }).join("");
    return `<h2>${STAGE_NAMES.audio}</h2>
      <audio id="voice" controls style="width:100%" src="/files/${PID}/audio/voice.mp3?v=${Date.now()}"></audio>
      <div class="muted">استهلك ${el.actual ?? "?"} credit (المتبقي ${el.left ?? "?"}). اسمع كل جملة لوحدها، ولو كلمة اتنطقت غلط صلّحها وأعد الجملة دي بس.</div>
      ${p.review ? `<div class="note ${Object.keys(flags).length ? "warn" : "ok"}">${Object.keys(flags).length ? "المراجعة لقت كلمات ممكن تكون اتنطقت غلط (باللون الأحمر)." : "✓ المراجعة ما لقتش كلمات غلط."}</div>` : ""}
      <div class="scenes" style="margin-top:var(--s3)">${rows}</div>
      <div class="actions">
        <button class="primary" data-act="approve" data-stage="audio">✓ موافق، صدّر الفيديو</button>
        ${p.can_undo ? `<button data-act="undo-sent">↶ رجّع الصوت زي ما كان قبل آخر إعادة</button>` : ""}
        <button data-act="review">🔎 راجع النطق (اختياري)</button>
        ${userVoice ? `<button data-act="voice-again">⏺ سجّل/ارفع صوتك تاني</button>` : `<button data-act="regen" data-stage="audio">↻ ولّد الصوت كله تاني (${p.audio_cost || "?"} credit)</button>`}
      </div>`;
  }

  function doneHTML(p) {
    return `<h2>✓ الفيديو جاهز</h2>
      <div class="row"><a class="btn primary" href="/files/${PID}/output/video.mp4?download=1">⬇ نزّل MP4</a><a class="btn" href="/library">المكتبة</a></div>
      ${p.credits_text ? `<div class="note ok" style="margin-top:var(--s4)">حط السطر ده في وصف الفيديو (الرخصة بتطلبه):<br><b dir="ltr">${esc(p.credits_text)}</b></div>` : ""}
      <div class="actions"><button data-act="regen" data-stage="render">↻ صدّر تاني</button><button data-act="back-audio">🎙 راجع الصوت أو صلّح جملة</button></div>`;
  }

  // تشغيل جملة واحدة من الصوت
  let segStop = null;
  $("#panel").addEventListener("click", (e) => {
    const b = e.target.closest(".play-seg"); if (!b) return;
    const v = $("#voice"); v.currentTime = +b.dataset.a; v.play();
    clearInterval(segStop); segStop = setInterval(() => { if (v.currentTime >= +b.dataset.b + 0.15) { v.pause(); clearInterval(segStop); } }, 50);
  });
  $("#panel").addEventListener("input", (e) => { if (e.target.matches(".sent, .tts")) dirty = true; });
  // فتح أي مرحلة خلصت علشان تعدّلها
  $("#stages").addEventListener("click", (e) => {
    const b = e.target.closest("[data-view]"); if (!b || !P) return;
    if (P.stages[b.dataset.view].status === "pending") return;
    VIEW = VIEW === b.dataset.view ? null : b.dataset.view; dirty = false; lastKey = ""; header(P); panel(P);
  });
  $("#panel").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    // أزرار محلية (من غير سيرفر)
    if (b.dataset.act === "add-sent") { const row = b.closest(".s"); row.insertAdjacentHTML("afterend", sentRow({ id: "", text: "" }, 0)); row.nextElementSibling.querySelector("textarea").focus(); dirty = true; return; }
    if (b.dataset.act === "del-sent") { b.closest(".s").remove(); dirty = true; return; }
    if (b.dataset.act === "rec-toggle") { recToggle().catch((err) => alert("مقدرتش أفتح المايك: " + err.message)); return; }
    if (b.dataset.act === "rec-send") { b.disabled = true; sendVoice(recBlob, "voice.webm").then(tick).catch((err) => { alert(err.message); b.disabled = false; }); return; }
    if (b.dataset.act === "voice-again") { await api(`/api/projects/${PID}/audio/need-voice`, { method: "POST" }); lastKey = ""; tick(); return; }
    if (b.dataset.act === "close-view") { VIEW = null; dirty = false; lastKey = ""; header(P); panel(P); return; }
    if (b.dataset.act === "inline-cancel") { b.closest(".inline-editor").remove(); dirty = !!$(".inline-editor"); return; }
    b.disabled = true;
    try {
      const stage = b.dataset.stage;
      const scriptRows = () => $$(".sentences .s").map((r) => ({ id: r.dataset.id === "" ? null : +r.dataset.id, text: r.querySelector(".sent").value }));
      if (b.dataset.act === "save-script") { await api(`/api/projects/${PID}/edit/script`, { method: "POST", body: { sentences: scriptRows() } }); VIEW = null; }
      if (b.dataset.act === "save-tts" || (b.dataset.act === "approve" && stage === "tts" && dirty)) {
        await api(`/api/projects/${PID}/edit/tts`, { method: "POST", body: { lines: $$(".tts-edit .s").map((r) => ({ id: +r.dataset.id, tts: r.querySelector(".tts").value })) } });
        VIEW = null;
      }
      if (b.dataset.act === "edit-scene") {   // محرر مضمّن تحت المشهد (بدل نافذة prompt)
        b.disabled = false; dirty = true;
        const host = b.closest(".grow"); if ($(".inline-editor", host)) return;
        host.insertAdjacentHTML("beforeend", `<div class="inline-editor"><label class="field-label" for="sc-${b.dataset.scene}">عاوز تغيّر إيه في المشهد ده؟</label>
          <textarea id="sc-${b.dataset.scene}" rows="2" placeholder="مثلًا: الشخصية تبقى قاعدة، الكاميرا من تحت، رسمة بدل أيقونة"></textarea>
          <div class="btn-row"><button class="primary" data-act="edit-scene-save" data-scene="${b.dataset.scene}">عدّل المشهد ده بس</button><button data-act="inline-cancel">إلغاء</button></div></div>`);
        $(`#sc-${b.dataset.scene}`).focus(); return;
      }
      if (b.dataset.act === "edit-scene-save") {
        const ins = $(`#sc-${b.dataset.scene}`).value.trim();
        if (!ins) { b.disabled = false; return; }
        await api(`/api/projects/${PID}/edit/scene/${b.dataset.scene}`, { method: "POST", body: { instruction: ins } }); VIEW = null;
      }
      if (b.dataset.act === "approve" && stage === "script" && dirty) await api(`/api/projects/${PID}/script`, { method: "PUT", body: { sentences: $$(".sent").map((t) => t.value).filter((x) => x.trim()) } });
      if (b.dataset.act === "approve") await api(`/api/projects/${PID}/stages/${stage}/approve`, { method: "POST" });
      if (b.dataset.act === "regen") await api(`/api/projects/${PID}/stages/${stage}/regenerate`, { method: "POST", body: { instruction: ($("#instr") || {}).value || null } });
      if (b.dataset.act === "resume") await api(`/api/projects/${PID}/resume`, { method: "POST" });
      if (b.dataset.act === "review") await api(`/api/projects/${PID}/audio/review`, { method: "POST" });
      if (b.dataset.act === "back-audio") await api(`/api/projects/${PID}/stages/audio/reopen`, { method: "POST" });
      if (b.dataset.act === "undo-sent") await api(`/api/projects/${PID}/audio/undo`, { method: "POST" });
      if (b.dataset.act === "regensent") await regenSentence(b.dataset.sid);
      if (b.dataset.act === "fixword") {   // محرر مضمّن تحت الجملة (بدل نافذتين prompt)
        b.disabled = false; dirty = true;
        const host = b.closest(".grow"); if ($(".inline-editor", host)) return;
        const words = [...new Set([...host.childNodes].filter((n) => n.nodeType === 3 || n.tagName === "B").map((n) => n.textContent).join(" ").trim().split(/\s+/).filter(Boolean))];
        host.insertAdjacentHTML("beforeend", `<div class="inline-editor">
          <div class="grid2"><div><label class="field-label" for="fw-${b.dataset.sid}">الكلمة اللي اتنطقت غلط</label>
            <input type="text" id="fw-${b.dataset.sid}" list="fwl-${b.dataset.sid}" placeholder="زي ما هي مكتوبة في الجملة"><datalist id="fwl-${b.dataset.sid}">${words.map((w) => `<option value="${esc(w)}">`).join("")}</datalist></div>
          <div><label class="field-label" for="ff-${b.dataset.sid}">تتنطق إزاي (بالتشكيل)</label><input type="text" id="ff-${b.dataset.sid}" placeholder="مثلًا: ضَجِيج"></div></div>
          <div class="help">النطق ده بيتحفظ في «ذوقي ← قاموس النطق» ويتطبّق على كل الفيديوهات، وبعدها الجملة دي بس بتتعاد.</div>
          <div class="btn-row"><button class="primary" data-act="fixword-save" data-sid="${b.dataset.sid}">احفظ وأعد الجملة دي</button><button data-act="inline-cancel">إلغاء</button></div></div>`);
        $(`#fw-${b.dataset.sid}`).focus(); return;
      }
      if (b.dataset.act === "fixword-save") {
        // الكلمة الغلط ← نطقها الصح في القاموس (بيفضل لكل الفيديوهات) ← إعادة الجملة دي بس
        const word = $(`#fw-${b.dataset.sid}`).value.trim(), fix = $(`#ff-${b.dataset.sid}`).value.trim();
        if (!word || !fix) { b.disabled = false; return; }
        const st = await api("/api/style");
        st.pronunciations[word] = fix;
        await api("/api/style", { method: "PUT", body: st });
        await regenSentence(b.dataset.sid);
      }
      dirty = false; lastKey = ""; phoneKey = "";
      await tick();
    } catch (err) { alert(err.message); b.disabled = false; }
  });
  // تغيير العنوان: محرر مضمّن تحت العنوان (بدل نافذة prompt)
  $("#rename").onclick = () => {
    const box = $("#renameBox"); box.hidden = false;
    box.innerHTML = `<div class="inline-editor" style="margin-bottom:var(--s3)"><label class="field-label" for="newTitle">العنوان الجديد</label>
      <input type="text" id="newTitle" value="${esc(P.title || "")}"><div class="btn-row"><button class="primary" id="titleSave">حفظ</button><button id="titleCancel">إلغاء</button></div></div>`;
    $("#newTitle").focus();
  };
  $("#renameBox").addEventListener("click", async (e) => {
    if (e.target.id === "titleCancel") { $("#renameBox").hidden = true; return; }
    if (e.target.id === "titleSave") { const t = $("#newTitle").value.trim(); if (t) { await api(`/api/projects/${PID}`, { method: "PATCH", body: { title: t } }); $("#renameBox").hidden = true; tick(); } }
  });

  async function tick() {
    try { P = await api(`/api/projects/${PID}`); header(P); panel(P); phone(P); } catch (e) { $("#panel").innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
  }
  tick(); setInterval(tick, 1500);
</script>
{% endblock %}
