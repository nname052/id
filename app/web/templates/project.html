{% extends "base.html" %}
{% block title %}المشروع{% endblock %}
{% block body %}
<div class="row" style="margin-bottom:6px">
  <h1 id="title" class="grow" style="margin:0">…</h1>
  <button id="rename" title="تغيير العنوان">✎</button>
</div>
<div class="muted" id="sub" style="margin-bottom:14px"></div>
<div class="stages" id="stages"></div>
<div class="layout">
  <div class="card" id="panel"><span class="spinner"></span></div>
  <div class="phone" id="phone"><div class="empty">المعاينة هتظهر هنا بعد ما المشاهد تجهز</div></div>
</div>
<details class="log card"><summary class="muted">تفاصيل (السجل والاستهلاك)</summary><div id="usage" class="muted"></div><pre id="log"></pre></details>
{% endblock %}
{% block script %}
<script>
  const PID = "{{ pid }}";
  let P = null, lastKey = "", dirty = false, phoneKey = "";

  const busy = (txt) => `<div class="row"><span class="spinner"></span><b>${esc(txt)}</b></div>`;
  const RUNNING_TEXT = { script: "Claude بيكتب السكريبت…", scenes: "Claude بيخطط المشاهد وبيدوّر في المكتبات…", tts: "بنجهّز النص للنطق…",
    audio: "ElevenLabs بيولّد الصوت…", render: "بنصدّر الفيديو…" };

  // المرحلة اللي محتاجة انتباهك دلوقتي
  function current(p) {
    const order = ["script", "scenes", "tts", "audio", "render"];
    return order.find((s) => ["running", "queued", "review", "failed", "waiting_limit", "needs_credits"].includes(p.stages[s].status))
      || (p.status === "done" ? "done" : order.find((s) => p.stages[s].status !== "approved") || "done");
  }

  function header(p) {
    $("#title").textContent = p.title || p.prompt;
    $("#sub").textContent = `${p.prompt} · ${p.settings.duration} ثانية · ${p.settings.voice_name || ""}`;
    $("#stages").innerHTML = Object.entries(STAGE_NAMES).map(([k, n]) => {
      const st = p.stages[k].status; return `<span class="stage ${st}">${n}${STATUS_NAMES[st] ? " · " + STATUS_NAMES[st] : ""}</span>`; }).join("");
    const u = p.usage || {}, el = u.elevenlabs || {};
    $("#usage").innerHTML = `طلبات Claude: ${u.claude_calls || 0} (${Object.entries(u.claude_by_stage || {}).map(([k, v]) => `${k}: ${v}`).join("، ")})` +
      (el.actual != null ? ` · ElevenLabs: متوقع ${el.expected}، فعلي ${el.actual}، متبقي ${el.left}` : "");
    $("#log").textContent = (p.log || []).join("\n");
  }

  function phone(p) {
    const key = p.has_video ? "video" : p.plan ? `player-${p.has_audio}-${p.stages.scenes.status}` : "";
    if (key === phoneKey) return;
    phoneKey = key;
    if (p.has_video) $("#phone").innerHTML = `<video controls playsinline src="/files/${PID}/output/video.mp4?v=${Date.now()}"></video>`;
    else if (p.plan) $("#phone").innerHTML = `<iframe src="/player/player.html?id=${PID}&mode=preview&v=${Date.now()}"></iframe>`;
  }

  function stuck(p, stage) {
    const st = p.stages[stage];
    if (st.status === "failed") return `<div class="note err">حصلت مشكلة: ${esc(st.error)}</div><div class="actions"><button class="primary" data-act="resume">↻ حاول تاني</button></div>`;
    if (st.status === "waiting_limit") {
      const at = p.resets_at ? new Date(p.resets_at * 1000).toLocaleTimeString("ar-EG", { hour: "numeric", minute: "2-digit" }) : "";
      return `<div class="note warn">وقفنا لأنك وصلت لحد استخدام Claude${at ? `، وبيتجدد الساعة ${at}` : ""}. كل اللي اتعمل محفوظ.</div><div class="actions"><button class="primary" data-act="resume">كمّل</button></div>`;
    }
    if (st.status === "needs_credits") return `<div class="note warn">${esc(st.error)}</div><div class="actions"><button class="primary" data-act="resume">موافق، كمّل</button></div>`;
    return null;
  }

  function panel(p) {
    const s = current(p), st = p.stages[s] || {};
    const k = `${s}:${st.status}:${p.has_video}:${JSON.stringify(st.progress || "")}`;
    if (k === lastKey || (dirty && st.status === "review")) return;
    lastKey = k; dirty = false;
    const el = $("#panel");
    if (s === "done") { el.innerHTML = doneHTML(p); return; }
    const blocked = stuck(p, s);
    if (blocked) { el.innerHTML = `<h2>${STAGE_NAMES[s]}</h2>` + blocked; return; }
    if (["running", "queued"].includes(st.status)) {
      let extra = "";
      if (s === "render" && st.progress) { const pc = Math.round((st.progress.done / st.progress.total) * 100); extra = `<div class="progress"><div style="width:${pc}%"></div></div><div class="muted">فريم ${st.progress.done} من ${st.progress.total}</div>`; }
      if (s === "audio" && p.audio_cost) extra = `<div class="muted">هيستهلك حوالي ${p.audio_cost} credit</div>`;
      el.innerHTML = `<h2>${STAGE_NAMES[s]}</h2>` + busy(RUNNING_TEXT[s]) + extra;
      return;
    }
    if (s === "script") el.innerHTML = scriptHTML(p);
    else if (s === "scenes") el.innerHTML = scenesHTML(p);
    else if (s === "audio") el.innerHTML = audioHTML(p);
    else el.innerHTML = `<h2>${STAGE_NAMES[s]}</h2><div class="actions"><button class="primary" data-act="approve" data-stage="${s}">كمّل</button></div>`;
  }

  function scriptHTML(p) {
    const sc = p.script || { sentences: [] };
    const words = sc.sentences.reduce((n, s) => n + s.text.split(/\s+/).length, 0);
    return `<h2>${STAGE_NAMES.script}</h2>
      <div class="muted">${sc.sentences.length} جملة · ${words} كلمة · حوالي ${Math.round(words / 2.2)} ثانية. عدّل أي جملة براحتك.</div>
      <div class="sentences" style="margin-top:12px">${sc.sentences.map((s, i) => `<div class="s"><span class="n">${i + 1}</span><textarea rows="1" class="sent">${esc(s.text)}</textarea></div>`).join("")}</div>
      <div class="actions">
        <button class="primary" data-act="approve" data-stage="script">✓ موافق، كمّل للمشاهد</button>
        <input type="text" id="instr" class="grow" placeholder="أو اطلب تعديل: خليه أقصر، الهوك أقوى، أكتر هزار…">
        <button data-act="regen" data-stage="script">↻ اكتب تاني</button>
      </div>`;
  }

  function thumb(sc) {
    if ((sc.kind === "illustration" || sc.kind === "icon") && sc.asset) return `<img src="/assets/${esc(sc.asset)}">`;
    if (sc.kind === "emoji") return "🎞";
    if (sc.kind === "number") return esc(sc.number_value || "#");
    return "Aa";
  }
  const KIND = { illustration: "رسمة", icon: "أيقونة", emoji: "إيموجي متحرك", number: "رقم", text: "كلمة كبيرة" };

  function scenesHTML(p) {
    const plan = p.plan || { scenes: [] }, sents = (p.script || { sentences: [] }).sentences;
    return `<h2>${STAGE_NAMES.scenes}</h2>
      <div class="muted">شغّل المعاينة على الشمال (من غير صوت، والتوقيت تقريبي لحد ما الصوت يتعمل).</div>
      <div class="scenes" style="margin-top:12px">${plan.scenes.map((sc, i) => `<div class="scene-card"><div class="thumb">${thumb(sc)}</div>
        <div class="grow"><div class="hd">${i + 1}. ${esc(sc.headline)}</div>
        <div class="muted">${sc.sentence_ids.map((id) => esc((sents.find((s) => s.id === id) || {}).text || "")).join(" ")}</div>
        <span class="badge">${KIND[sc.kind] || sc.kind}</span> ${sc.asset_name ? `<span class="badge" dir="ltr">${esc(sc.asset_name)}</span>` : ""} ${sc.fetched ? `<span class="badge">اتنزّلت جديد</span>` : ""}</div></div>`).join("")}</div>
      <div class="actions">
        <button class="primary" data-act="approve" data-stage="scenes">✓ موافق، اعمل الصوت</button>
        <input type="text" id="instr" class="grow" placeholder="اطلب تعديل: المشهد التالت أيقونة بدل رسمة، ألوان أهدى…">
        <button data-act="regen" data-stage="scenes">↻ خطط تاني</button>
      </div>`;
  }

  function audioHTML(p) {
    const el = (p.usage || {}).elevenlabs || {};
    return `<h2>${STAGE_NAMES.audio}</h2>
      <audio controls style="width:100%" src="/files/${PID}/audio/voice.mp3?v=${Date.now()}"></audio>
      <div class="muted">استهلك ${el.actual ?? "?"} credit (المتبقي ${el.left ?? "?"}). المعاينة على الشمال بقت بالصوت والتوقيت الحقيقي.</div>
      <div class="actions">
        <button class="primary" data-act="approve" data-stage="audio">✓ موافق، صدّر الفيديو</button>
        <button data-act="regen" data-stage="audio">↻ ولّد الصوت تاني (${p.audio_cost || "?"} credit)</button>
      </div>`;
  }

  function doneHTML(p) {
    return `<h2>✓ الفيديو جاهز</h2>
      <div class="row"><a class="btn primary" href="/files/${PID}/output/video.mp4?download=1">⬇ نزّل MP4</a><a class="btn" href="/library">المكتبة</a></div>
      ${p.credits_text ? `<div class="note ok" style="margin-top:14px">حط السطر ده في وصف الفيديو (الرخصة بتطلبه):<br><b dir="ltr">${esc(p.credits_text)}</b></div>` : ""}
      <div class="actions"><button data-act="regen" data-stage="render">↻ صدّر تاني</button></div>`;
  }

  $("#panel").addEventListener("input", (e) => { if (e.target.classList.contains("sent")) dirty = true; });
  $("#panel").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    b.disabled = true;
    try {
      const stage = b.dataset.stage;
      if (b.dataset.act === "approve" && stage === "script" && dirty) await api(`/api/projects/${PID}/script`, { method: "PUT", body: { sentences: $$(".sent").map((t) => t.value) } });
      if (b.dataset.act === "approve") await api(`/api/projects/${PID}/stages/${stage}/approve`, { method: "POST" });
      if (b.dataset.act === "regen") await api(`/api/projects/${PID}/stages/${stage}/regenerate`, { method: "POST", body: { instruction: ($("#instr") || {}).value || null } });
      if (b.dataset.act === "resume") await api(`/api/projects/${PID}/resume`, { method: "POST" });
      dirty = false; lastKey = ""; phoneKey = "";
      await tick();
    } catch (err) { alert(err.message); b.disabled = false; }
  });
  $("#rename").onclick = async () => { const t = prompt("العنوان الجديد", P.title || ""); if (t) { await api(`/api/projects/${PID}`, { method: "PATCH", body: { title: t } }); tick(); } };

  async function tick() {
    try { P = await api(`/api/projects/${PID}`); header(P); panel(P); phone(P); } catch (e) { $("#panel").innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
  }
  tick(); setInterval(tick, 1500);
</script>
{% endblock %}
