{% extends "base.html" %}
{% block title %}المكتبة{% endblock %}
{% block body %}
<h1>المكتبة</h1>
<div class="grid" id="grid"><span class="spinner"></span></div>
<div class="modal" id="modal" hidden></div>
{% endblock %}
{% block script %}
<script>
  const STATUS = { done: "جاهز", awaiting_review: "مستني موافقتك", running: "شغال…", queued: "في الطابور", failed: "فشل", waiting_limit: "واقف", needs_credits: "محتاج موافقة" };
  async function load() {
    const list = await api("/api/projects");
    $("#grid").innerHTML = list.length ? list.map((v) => `<div class="vcard" data-id="${v.id}">
      <div class="cover">${v.thumb ? `<img src="/files/${v.id}/output/thumb.jpg">` : `<span>${esc(STATUS[v.status] || v.status)}</span>`}</div>
      <div class="body"><div class="ttl">${esc(v.title || v.prompt)}</div>
        <div class="muted">${fmtDate(v.created)}${v.duration ? ` · ${Math.round(v.duration)} ث` : ""}</div>
        <div class="acts">
          ${v.video ? `<button data-act="play">▶ عرض</button><a class="btn" href="/files/${v.id}/output/video.mp4?download=1">⬇ MP4</a>` : ""}
          <a class="btn" href="/p/${v.id}">✎ فتح</a>
          <button class="danger" data-act="del">🗑 حذف</button>
        </div></div></div>`).join("")
      : `<div class="card">لسه مفيش فيديوهات. <a href="/new">اعمل أول فيديو</a></div>`;
  }
  $("#grid").onclick = async (e) => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const card = b.closest(".vcard"), id = card.dataset.id, title = $(".ttl", card).textContent;
    if (b.dataset.act === "play") { $("#modal").innerHTML = `<video controls autoplay src="/files/${id}/output/video.mp4"></video>`; $("#modal").hidden = false; }
    if (b.dataset.act === "del" && confirm(`تمسح "${title}" نهائي؟`)) { await api(`/api/projects/${id}`, { method: "DELETE" }); load(); }
  };
  $("#modal").onclick = (e) => { if (e.target.id === "modal") { $("#modal").hidden = true; $("#modal").innerHTML = ""; } };
  load();
</script>
{% endblock %}
