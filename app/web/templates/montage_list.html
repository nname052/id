{% extends "base.html" %}
{% block title %}المونتاج{% endblock %}
{% block body %}
<div class="page-head">
  <div><h1>المونتاج</h1><div class="sub">ارفع فيديو صوّرته، ودوس «اعمل المونتاج»: القصّ والترجمة والكروت والألوان والصوت بيتعملوا لوحدهم، وإنت تراجع قبل التصدير.</div></div>
</div>

<div class="stack">
  <section class="card narrow" aria-labelledby="h-up">
    <div class="card-head"><h2 id="h-up">مونتاج جديد</h2></div>
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".mp4,.mov,.m4a,video/mp4,video/quicktime,audio/mp4" hidden>
      <span class="big">اسحب الفيديو هنا أو دوس علشان تختاره</span>
      <span class="muted">MP4 أو MOV (فيديو) · M4A (صوت). الملف الأصلي بيتحفظ زي ما هو، والشغل كله على نسخة منه.</span>
    </label>
    <div id="picked" style="margin-top:var(--s3)" hidden></div>
    <div id="msg" role="status"></div>
  </section>

  <section aria-labelledby="h-list">
    <div class="card-head"><h2 id="h-list">المونتاجات</h2></div>
    <div id="list" class="m-list"><span class="muted">مفيش لسه.</span></div>
  </section>
</div>
{% endblock %}
{% block script %}
<script>
  const when = (u) => new Date(u * 1000).toLocaleString("ar-EG", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
  const size = (b) => b > 1e9 ? `${(b / 1e9).toFixed(2)} GB` : b > 1e6 ? `${(b / 1e6).toFixed(1)} MB` : `${Math.round(b / 1e3)} KB`;
  const mmss = (x) => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, "0")}`;
  async function load() {
    const rows = await api("/api/montage");
    $("#list").innerHTML = rows.length ? rows.map((m) => `<div class="m-item" data-id="${m.id}" data-title="${esc(m.title)}"><a href="/montage/${m.id}">
      <img class="cv" src="/montage-files/${m.id}/thumb.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="bd"><div class="tt">${esc(m.title)}</div><div class="meta"><span>${m.sources} ملف</span><span>${when(m.created)}</span>${m.export === "done" ? `<span class="pill approved">✓ اتصدّر</span>` : ""}</div></div></a>
      <div class="ft"><button class="danger" data-act="del" aria-label="حذف ${esc(m.title)}">🗑 حذف</button></div></div>`).join("")
      : `<span class="muted">مفيش لسه.</span>`;
  }
  // الحذف: بتأكيد، والمونتاج بيروح «المحذوفات» أسبوع (تقدر ترجّعه)، وبعدها بيتمسح نهائي
  $("#list").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-act=del]"); if (!b) return;
    const card = b.closest(".m-item"), title = card.dataset.title;
    if (!confirm(`تحذف مونتاج "${title}"؟\nهيروح «المحذوفات» وتقدر ترجّعه زي ما هو لمدة أسبوع، وبعدها بيتمسح نهائي. الملف الأصلي اللي على جهازك برّه التطبيق مش هيتلمس.`)) return;
    b.disabled = true;
    try { await api(`/api/montage/${card.dataset.id}`, { method: "DELETE" }); load(); }
    catch (err) { b.disabled = false; $("#msg").innerHTML = `<div class="note err">${esc(err.message || "الحذف فشل")}</div>`; }
  });
  function show(f, info) {
    const ext = (f.name.split(".").pop() || "").toUpperCase();
    $("#picked").hidden = false;
    $("#picked").innerHTML = `<div class="file-row"><div class="ic">${info && info.thumb ? `<img src="${info.thumb}" alt="">` : (f.type.startsWith("audio") || ext === "M4A" ? "♪" : "▶")}</div>
      <div><div class="nm">${esc(f.name)}</div><div class="meta"><span>${ext}</span><span>${size(f.size)}</span>
      ${info && info.duration ? `<span>${mmss(info.duration)} (${info.duration.toFixed(1)} ث)</span>` : ""}${info && info.res ? `<span>${info.res}</span>` : ""}${info && info.fps ? `<span>${info.fps} فريم/ث</span>` : ""}</div>
      ${info && info.progress !== undefined ? `<div class="upload-progress" style="margin-top:var(--s2)"><div style="width:${info.progress}%"></div></div>` : ""}</div>
      <div>${info && info.href ? `<a class="btn primary" href="${info.href}">افتح المونتاج ←</a>` : ""}</div></div>`;
  }
  function upload(f) {
    const ext = "." + (f.name.split(".").pop() || "").toLowerCase();
    if (![".mp4", ".mov", ".m4a"].includes(ext)) { $("#msg").innerHTML = `<div class="note err">النوع ده مش مقبول. ارفع فيديو mp4 أو mov، أو صوت m4a.</div>`; return; }
    $("#msg").innerHTML = ""; show(f, { progress: 0 });
    const fd = new FormData(); fd.append("file", f);
    const x = new XMLHttpRequest();
    x.upload.onprogress = (ev) => { const b = $("#picked .upload-progress > div"); if (b && ev.lengthComputable) b.style.width = `${Math.round(ev.loaded / ev.total * 100)}%`; };
    x.onload = () => {
      let d = {}; try { d = JSON.parse(x.responseText); } catch (_) {}
      if (x.status >= 300) { $("#msg").innerHTML = `<div class="note err">${esc(d.detail || "الرفع فشل")}</div>`; $("#picked").hidden = true; return; }
      const p = d.source.probe;
      show(f, { duration: p.duration, res: p.has_video ? `\u2066${p.width}×${p.height}\u2069` : "صوت بس", fps: p.fps ? Math.round(p.fps) : null,
                thumb: p.has_video ? `/montage-files/${d.id}/thumb.jpg` : null, href: `/montage/${d.id}` });
      $("#msg").innerHTML = `<div class="note ok">✓ اترفع واتفحص. افتح المونتاج ودوس «اعمل المونتاج».</div>`; load();
    };
    x.onerror = () => { $("#msg").innerHTML = `<div class="note err">الرفع فشل (الاتصال اتقطع)</div>`; };
    x.open("POST", "/api/montage"); x.send(fd);
  }
  $("#file").onchange = () => { if ($("#file").files[0]) upload($("#file").files[0]); };
  ["dragover", "dragenter"].forEach((ev) => $("#drop").addEventListener(ev, (e) => { e.preventDefault(); $("#drop").classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => $("#drop").addEventListener(ev, () => $("#drop").classList.remove("over")));
  $("#drop").addEventListener("drop", (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });
  load();
</script>
{% endblock %}
