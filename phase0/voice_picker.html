<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختيار الصوت</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc;
    --accent: #c2410c; --accent-soft: #fde8dc; --ok: #15803d; --ok-soft: #dcf3e3; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1d1d20; --text: #ececee; --muted: #9a9aa2; --line: #2e2e33;
      --accent: #fb923c; --accent-soft: #3a2416; --ok: #4ade80; --ok-soft: #173322; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 "IBM Plex Sans Arabic", "Geeza Pro", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 14px 16px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .meta b { color: var(--text); font-weight: 600; }
  .panel { display: grid; gap: 10px; margin-top: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, textarea, button { font: inherit; color: inherit; }
  input, select, textarea { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  textarea { width: 100%; resize: vertical; min-height: 44px; }
  input[type=search] { flex: 1 1 200px; }
  label.small { font-size: 13px; color: var(--muted); }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 16px; }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
  .card.selected { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok-soft); }
  .name { font-weight: 600; direction: ltr; text-align: right; overflow-wrap: anywhere; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
  .tag.eg { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .tag.mine { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .desc { font-size: 13px; color: var(--muted); direction: ltr; text-align: right;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .status { font-size: 12px; min-height: 1em; }
  .status.err { color: var(--err); }
  .more { display: block; margin: 16px auto; }
  .more[hidden] { display: none; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  @media (max-width: 700px) { header { position: static; } }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>اختيار الصوت</h1>
    <div class="meta">
      <span>الصوت الحالي: <b id="current">-</b></span>
      <span>رصيد ElevenLabs: <b id="credits">…</b></span>
    </div>
    <div class="panel">
      <div class="row">
        <input id="q" type="search" placeholder="دوّر بالاسم أو الوصف…">
        <select id="accent"></select>
        <select id="gender">
          <option value="">ذكر وأنثى</option><option value="male">ذكر</option><option value="female">أنثى</option>
        </select>
        <select id="age"><option value="">كل الأعمار</option></select>
        <select id="usecase"><option value="">كل الاستخدامات</option></select>
        <select id="source">
          <option value="">حسابي + المكتبة</option><option value="mine">حسابي بس</option><option value="library">المكتبة بس</option>
        </select>
      </div>
      <label class="small" for="text">جملة التجربة (زرار "جرّب بجملتي" بيستهلك credits بعدد الحروف):</label>
      <textarea id="text" rows="2">[whispers] أَنَا عَارِف إِنَّك خَايِف تِفْشَل... بَسّ الخُوف مِش هَيِحْمِيك.</textarea>
      <div class="row">
        <label class="small" for="stability">الثبات (stability):</label>
        <select id="stability">
          <option value="0">إبداعي 0.0: الـ tags والهمس أوضح</option>
          <option value="0.5" selected>طبيعي 0.5</option>
          <option value="1">ثابت 1.0: الـ tags بتضعف</option>
        </select>
        <span class="small" id="cost"></span>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="count" id="count">بنحمّل الأصوات من ElevenLabs… (أول مرة بتاخد ثواني)</div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>اعرض أكتر</button>
</main>

<script>
const PAGE = 60;
const ACCENT_AR = { egyptian: "مصري", "modern standard": "فصحى", saudi: "سعودي", levantine: "شامي", gulf: "خليجي",
  jordanian: "أردني", moroccan: "مغربي", kuwaiti: "كويتي", omani: "عماني", syrian: "سوري", algerian: "جزائري",
  palestinian: "فلسطيني", tunisian: "تونسي", iraqi: "عراقي", lebanese: "لبناني", emirati: "إماراتي", standard: "قياسي",
  american: "أمريكي", british: "بريطاني" };
const AGE_AR = { young: "شاب", middle_aged: "متوسط", old: "كبير" };
const GENDER_AR = { male: "ذكر", female: "أنثى" };
const $ = (id) => document.getElementById(id);
let voices = [], selected = "", shown = PAGE, player = new Audio(), playingBtn = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const accentOf = (v) => (v.egyptian ? "egyptian" : (v.accent || "").toLowerCase());

function fillSelect(el, values, labels, first) {
  el.innerHTML = `<option value="">${first}</option>` +
    values.map((v) => `<option value="${esc(v)}">${esc(labels[v] || v)}</option>`).join("");
}

function counts(key) {
  const c = {};
  voices.forEach((v) => { const k = key(v); if (k) c[k] = (c[k] || 0) + 1; });
  return Object.keys(c).sort((a, b) => c[b] - c[a]);
}

function filtered() {
  const q = $("q").value.trim().toLowerCase();
  return voices.filter((v) =>
    (!$("accent").value || accentOf(v) === $("accent").value) &&
    (!$("gender").value || v.gender === $("gender").value) &&
    (!$("age").value || v.age === $("age").value) &&
    (!$("usecase").value || v.use_case === $("usecase").value) &&
    (!$("source").value || v.source === $("source").value) &&
    (!q || `${v.name} ${v.description} ${v.accent}`.toLowerCase().includes(q)));
}

function render() {
  const list = filtered();
  $("count").textContent = `${list.length} صوت من ${voices.length}`;
  $("grid").innerHTML = list.length ? list.slice(0, shown).map((v) => `
    <div class="card ${v.voice_id === selected ? "selected" : ""}" data-id="${esc(v.voice_id)}">
      <div class="name">${esc(v.name)}</div>
      <div class="tags">
        ${v.egyptian ? '<span class="tag eg">مصري</span>' : v.accent ? `<span class="tag">${esc(ACCENT_AR[v.accent.toLowerCase()] || v.accent)}</span>` : ""}
        ${v.source === "mine" ? '<span class="tag mine">في حسابك</span>' : ""}
        ${v.gender ? `<span class="tag">${esc(GENDER_AR[v.gender] || v.gender)}</span>` : ""}
        ${v.age ? `<span class="tag">${esc(AGE_AR[v.age] || v.age)}</span>` : ""}
        ${v.use_case ? `<span class="tag">${esc(v.use_case.replace(/_/g, " "))}</span>` : ""}
      </div>
      <div class="desc" title="${esc(v.description)}">${esc(v.description) || "&nbsp;"}</div>
      <div class="actions">
        <button data-act="preview" ${v.preview_url ? "" : "disabled"}>▶ عينة (مجانًا)</button>
        <button data-act="test">🎙 جرّب بجملتي</button>
        <button data-act="select" class="${v.voice_id === selected ? "" : "primary"}">${v.voice_id === selected ? "✓ مختار" : "اختار"}</button>
      </div>
      <div class="status"></div>
    </div>`).join("") : '<div class="empty">مفيش أصوات بالفلتر ده</div>';
  $("more").hidden = list.length <= shown;
}

function stopPlayer() {
  player.pause();
  if (playingBtn) playingBtn.textContent = playingBtn.dataset.label;
  playingBtn = null;
}

function play(src, btn) {
  const same = playingBtn === btn;
  stopPlayer();
  if (same) return;
  btn.dataset.label = btn.textContent;
  btn.textContent = "■ وقّف";
  playingBtn = btn;
  player = new Audio(src);
  player.onended = stopPlayer;
  player.play().catch(stopPlayer);
}

function updateCost() {
  const n = $("text").value.trim().length;
  $("cost").textContent = `التجربة الواحدة ≈ ${n} credit`;
}

async function loadCredits() {
  try {
    const u = await (await fetch("/api/usage")).json();
    $("credits").textContent = u.error ? u.error : `${(u.limit - u.used).toLocaleString("ar-EG")} متبقي من ${u.limit.toLocaleString("ar-EG")}`;
  } catch { $("credits").textContent = "-"; }
}

function showCurrent() {
  const v = voices.find((x) => x.voice_id === selected);
  $("current").textContent = v ? v.name : selected ? selected : "مش متحدد (أول صوت في حسابك)";
}

$("grid").addEventListener("click", async (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const card = btn.closest(".card");
  const v = voices.find((x) => x.voice_id === card.dataset.id);
  const status = card.querySelector(".status");
  status.className = "status";
  status.textContent = "";

  if (btn.dataset.act === "preview") play(v.preview_url, btn);

  if (btn.dataset.act === "test") {
    const text = $("text").value.trim();
    if (!text) return;
    if (!confirm(`التجربة دي هتستهلك حوالي ${text.length} credit. أكمّل؟`)) return;
    btn.disabled = true;
    status.textContent = "بنولّد الصوت…";
    try {
      const r = await fetch("/api/test", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ voice_id: v.voice_id, text, stability: parseFloat($("stability").value) }) });
      if (!r.ok) throw new Error((await r.json()).error);
      const url = URL.createObjectURL(await r.blob());
      status.textContent = `جاهز (stability ${$("stability").value})`;
      btn.disabled = false;
      play(url, btn);
      loadCredits();
    } catch (err) {
      status.className = "status err";
      status.textContent = err.message;
      btn.disabled = false;
    }
  }

  if (btn.dataset.act === "select") {
    const r = await fetch("/api/select", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ voice_id: v.voice_id }) });
    const d = await r.json();
    if (!r.ok) { status.className = "status err"; status.textContent = d.error; return; }
    selected = d.selected;
    showCurrent();
    render();
  }
});

["q", "accent", "gender", "age", "usecase", "source"].forEach((id) =>
  $(id).addEventListener("input", () => { shown = PAGE; render(); }));
$("more").addEventListener("click", () => { shown += PAGE; render(); });
$("text").addEventListener("input", updateCost);

(async () => {
  updateCost();
  loadCredits();
  try {
    const r = await fetch("/api/voices");
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    voices = d.voices;
    selected = d.selected;
  } catch (err) {
    $("count").textContent = "مقدرتش أحمّل الأصوات: " + err.message;
    return;
  }
  fillSelect($("accent"), counts(accentOf), ACCENT_AR, "كل اللهجات");
  fillSelect($("age"), counts((v) => v.age), AGE_AR, "كل الأعمار");
  fillSelect($("usecase"), counts((v) => v.use_case), {}, "كل الاستخدامات");
  $("accent").value = "egyptian";
  showCurrent();
  render();
})();
</script>
</body>
</html>
