[project]
name = "tiktok-motion"
version = "0.0.1"
description = "Local TikTok motion-graphics video generator"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "playwright>=1.48",
    "psutil>=6.0",
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "scenedetect[opencv-headless]>=0.7.2",
    "numpy>=2.5.4",
    "faster-whisper>=1.2.1",
    "mediapipe>=0.10",
]

[tool.uv]
package = false
