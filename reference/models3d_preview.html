<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>شخصيات 3D</title>
<!-- معاينة لشخصيات 3D: كل شخصية واقفة في وضعية من حركاتها. renderAt(t) بيحرّك كل الحركات للوقت t (AnimationMixer.setTime) -->
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: #fef6e4; }
  canvas { display: block; }
  .label { position: absolute; bottom: 40px; width: 300px; text-align: center; font: 600 22px "Alexandria"; color: #001858; }
  .label small { display: block; font-weight: 400; font-size: 16px; color: #6b6b70; }
</style>
<script type="importmap">
  { "imports": { "three": "../assets/vendor/three/three.module.js", "three/addons/": "../assets/vendor/three/addons/" } }
</script>
</head>
<body>
<script type="module">
  import * as THREE from "three";
  import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

  const W = 1600, H = 900;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color("#fef6e4");
  const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
  camera.position.set(0, 1.5, 12.5);
  camera.lookAt(0, 1.0, 0);
  scene.add(new THREE.HemisphereLight("#ffffff", "#e8d9c0", 2.2));
  const sun = new THREE.DirectionalLight("#fff4e0", 2.5);
  sun.position.set(3, 6, 5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 6, bottom: -2 });
  scene.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.ShadowMaterial({ opacity: 0.18 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // [الملف، الحركة (جزء من الاسم)، الطول بالمتر، العنوان، سطر صغير، ملف الحركات (لو الشخصية من غير حركات)]
  const UAL1 = "../assets/3d/ual1/AnimationLibrary_Godot_Standard.glb", UAL2 = "../assets/3d/ual2/UAL2_Standard.glb";
  const MODELS = [
    [UAL1, "idle_talking", 1.8, "مانيكان (راجل)", "نسب طبيعية · بيتكلم"],
    ["../assets/3d/ual2/Mannequin_F.glb", "idle_foldarms", 1.7, "مانيكان (ست)", "نفس الهيكل · 89 حركة", UAL2],
    ["../assets/3d/kaykit-adventurers/Knight.glb", "idle", 1.8, "KayKit فارس", "75 حركة"],
    ["../assets/3d/kaykit-adventurers/Mage.glb", "spellcast", 1.8, "KayKit ساحر", "بيعمل سحر"],
    ["../assets/3d/mini-characters/character-female-a.glb", "idle", 1.3, "Kenney Mini", "32 حركة"],
    ["../assets/3d/RobotExpressive.glb", "wave", 1.7, "روبوت Quaternius", "بيلوّح · تعبيرات وش"],
  ];
  const mixers = [];
  const loader = new GLTFLoader();

  window.ready = (async () => {
    const results = await Promise.allSettled(MODELS.map(([url]) => loader.loadAsync(url)));
    const sources = {};
    for (const m of MODELS) if (m[5] && !sources[m[5]]) sources[m[5]] = await loader.loadAsync(m[5]);
    const xs = MODELS.map((_, i) => (i - (MODELS.length - 1) / 2) * 1.75);
    results.forEach((r, i) => {
      const [url, anim, height, title, sub, animSrc] = MODELS[i];
      const label = document.createElement("div");
      label.className = "label";
      label.style.left = (W / 2 + xs[i] * 133 - 150) + "px";
      label.innerHTML = r.status === "fulfilled" ? `${title}<small>${sub}</small>` : `❌ ${title}<small>${r.reason}</small>`;
      document.body.appendChild(label);
      if (r.status !== "fulfilled") return;
      const gltf = r.value, root = gltf.scene;
      root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
      // نوحّد الطول ونحط الرجلين على الأرض
      const box = new THREE.Box3().setFromObject(root);
      const s = height / (box.max.y - box.min.y);
      root.scale.setScalar(s);
      root.position.set(xs[i], -box.min.y * s, 0);
      root.rotation.y = -0.35;
      scene.add(root);
      const clips = animSrc ? sources[animSrc].animations : gltf.animations;
      const clip = clips.find((a) => a.name.toLowerCase().includes(anim)) || clips[0];
      if (clip) {
        const mixer = new THREE.AnimationMixer(root);
        mixer.clipAction(clip).play();
        mixers.push(mixer);
      }
      window.__anims = window.__anims || {};
      window.__anims[title] = gltf.animations.map((a) => a.name);
    });
    window.renderAt(0);
  })();

  window.renderAt = (t) => {
    mixers.forEach((m) => m.setTime(t));
    renderer.render(scene, camera);
  };
</script>
</body>
</html>
