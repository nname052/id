<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>شخصيات Mixamo</title>
<!-- عرض لكل شخصيات Mixamo مع بعض، كل واحدة بحركة مختلفة من مكتبة anims/ (اتحولت عليها بـ lib/mixamo.js). 1920×1080 -->
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fef6e4; }
  canvas { display: block; }
  .label { position: absolute; width: 220px; z-index: 2; text-align: center; font: 700 22px "Alexandria"; color: #001858; }
  .label small { display: block; font: 400 15px "Alexandria"; color: #6b6b70; }
  #title { position: absolute; top: 28px; width: 100%; text-align: center; font: 800 44px "Alexandria"; color: #001858; }
</style>
<script type="importmap">
  { "imports": { "three": "../assets/vendor/three/three.module.js", "three/addons/": "../assets/vendor/three/addons/" } }
</script>
</head>
<body>
<div id="title">12 شخصية · 40 حركة مشتركة</div>
<script type="module">
  import * as THREE from "three";
  import { loadCharacter, play, hdriEnvironment } from "./lib/mixamo.js";

  window.DURATION = 6;
  const W = 1920, H = 1080;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color("#fef6e4");
  const camera = new THREE.PerspectiveCamera(26, W / H, 0.1, 100);
  camera.position.set(0, 2.5, 11.2);
  camera.lookAt(0, 0.95, -0.5);
  const sun = new THREE.DirectionalLight("#fff2dd", 1.6);
  sun.position.set(4, 8, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 6, bottom: -3 });
  scene.add(sun, sun.target);
  Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -1 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), new THREE.ShadowMaterial({ opacity: 0.16 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // [الشخصية، الحركة، الطول بالمتر، الاسم، وصف]
  const CAST = [
    ["Aj_Idle", "Aj_Talking", 1.75, "Aj", "بيتكلم"],
    ["characters/Claire", "waving_both", 1.68, "Claire", "بتسلّم"],
    ["characters/Amy", "laughing", 1.6, "Amy", "بتضحك"],
    ["characters/Kaya", "dancing_silly", 1.65, "Kaya", "بترقص"],
    ["characters/Sporty_Granny", "cheering", 1.6, "Sporty Granny", "بتشجّع"],
    ["characters/Megan", "texting", 1.68, "Megan", "بتكتب على الموبايل"],
    ["characters/Kate", "happy_gesture", 1.68, "Kate", "مبسوطة"],
    ["characters/Jody", "shrug", 1.66, "Jody", "مش عارفة"],
    ["characters/Ty", "excited", 1.3, "Ty", "متحمس"],
    ["characters/Timmy", "clapping", 1.25, "Timmy", "بيسقف"],
    ["characters/Big_Vegas", "pointing", 1.6, "Big Vegas", "بيشاور"],
    ["characters/Doozy", "surprised", 1.3, "Doozy", "متفاجئ", { normalMaps: false }],
  ];
  const actions = [], chars = [];
  // مربع كل شخصية: [x, y من تحت, عرض, طول] بالبكسل
  const COLS = 6, TOP = 110, TW = W / COLS, TH = (H - TOP) / 2;
  const tile = (i) => [(i % COLS) * TW, (1 - Math.floor(i / COLS)) * TH, TW, TH];
  const tileCam = new THREE.PerspectiveCamera(28, TW / TH, 0.1, 100);

  window.ready = (async () => {
    await hdriEnvironment(renderer, scene, "brown_photostudio_02");
    // شبكة 6×2: كل شخصية في مكان بعيد لوحدها، وليها كاميرا ومربع على الشاشة
    for (const [i, [file, anim, h, label, sub, opts]] of CAST.entries()) {
      const ch = await loadCharacter(file, { heightM: h, ...opts });
      ch.root.position.set(i * 6, 0, 0);
      ch.root.rotation.y = -0.25;
      scene.add(ch.root);
      chars.push(ch);
      actions.push([ch, await play(ch, anim)]);
      const [tx, ty, tw, th] = tile(i);
      const el = document.createElement("div");
      el.className = "label";
      el.style.left = (tx + tw / 2 - 110) + "px";
      el.style.top = (H - ty - 62) + "px";
      el.innerHTML = `${label}<small>${sub}</small>`;
      document.body.appendChild(el);
    }
    await document.fonts.ready;
    window.renderAt(0);
  })();

  renderer.setScissorTest(true);
  window.renderAt = (t) => {
    renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H); renderer.clear();
    actions.forEach(([ch, a], i) => {
      a.time = t % a.getClip().duration;
      ch.mixer.update(0);
      const x = ch.root.position.x, [tx, ty, tw, th] = tile(i);
      tileCam.position.set(x + 0.55, 1.15, 4.6);
      tileCam.lookAt(x, 0.88, 0);
      sun.position.set(x + 3, 7, 5); sun.target.position.set(x, 0, 0); sun.target.updateMatrixWorld();
      renderer.setViewport(tx, ty, tw, th); renderer.setScissor(tx, ty, tw, th);
      renderer.render(scene, tileCam);
    });
  };
</script>
</body>
</html>
