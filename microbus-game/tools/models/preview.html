<!doctype html><meta charset=utf8><body style="margin:0;background:#bcd">
<script type="module">
// معاينة موديل GLB (للفحص قبل ما يدخل اللعبة): /tools/models/preview.html?f=/@fs/<path>&yaw=0
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';
const q = new URLSearchParams(location.search);
const R = new THREE.WebGLRenderer({ antialias: true }); R.setSize(innerWidth, innerHeight); document.body.appendChild(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color(0xbbccdd);
S.add(new THREE.HemisphereLight(0xffffff, 0x667755, 2)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(3, 5, 2); S.add(d);
const L = new GLTFLoader(); L.setMeshoptDecoder(MeshoptDecoder);
const g = await L.loadAsync(q.get('f')); const o = g.scene; S.add(o);
o.updateMatrixWorld(true);
if (q.get('hl')) { const re = new RegExp(q.get('hl')); const cols = [0xff2020, 0x2040ff]; o.traverse((m) => { if (!m.isMesh) return; let k = -1, n = m; while (n) { const i = (n.name || '').match(re); if (i) { k = n.name.includes('tail') ? 1 : 0; break; } n = n.parent; } if (k >= 0) m.material = new THREE.MeshBasicMaterial({ color: cols[k] }); }); }
const box = new THREE.Box3().setFromObject(o), sz = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
const r = sz.length() * 0.75, views = [(q.get("v")==="close"?[[0.25,0.08,-0.35],[0.25,0.35,0.05]]:[[1, 0.5, 1], [0, 1.6, 0.001]])[0], (q.get("v")==="close"?[[0.25,0.08,-0.35],[0.25,0.35,0.05]]:[[1, 0.5, 1], [0, 1.6, 0.001]])[1], [1, 0.1, 0], [0, 0.1, 1]];
const W = innerWidth / 2, H = innerHeight / 2; R.setScissorTest(true);
const cam = new THREE.PerspectiveCamera(40, W / H, r / 100, r * 10);
views.forEach((v, i) => { const x = (i % 2) * W, y = (i < 2 ? 1 : 0) * H; R.setViewport(x, y, W, H); R.setScissor(x, y, W, H);
  cam.position.set(c.x + v[0] * r, c.y + v[1] * r, c.z + v[2] * r); cam.lookAt(c); R.render(S, cam); });
const meshes = []; o.traverse((m) => { if (m.isMesh) { const b = new THREE.Box3().setFromObject(m); meshes.push({ n: m.name, mat: m.material.name, tris: (m.geometry.index?.count || m.geometry.attributes.position.count) / 3, min: b.min.toArray().map((v) => +v.toFixed(2)), max: b.max.toArray().map((v) => +v.toFixed(2)) }); } });
window.INFO = { size: sz.toArray(), center: c.toArray(), meshes };
document.title = 'ready';
</script>
