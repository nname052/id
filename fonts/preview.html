<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الخطوط العربية</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --bg: #f6f5f2; --card: #fff; --text: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --card: #1d1d20; --text: #ececee; --muted: #9a9aa2; --line: #2e2e33; --accent: #fb923c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "IBM Plex Sans Arabic", system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .intro { color: var(--muted); margin: 0 0 16px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  input, select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  input { flex: 1 1 260px; }
  h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 28px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .name { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .name b { color: var(--text); direction: ltr; }
  .sample { font-size: 40px; line-height: 1.5; overflow-wrap: anywhere; }
  .use { font-size: 13px; color: var(--accent); margin-top: 6px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .sample { font-size: 32px; } }
</style>
</head>
<body>
<main>
  <h1>الخطوط العربية</h1>
  <p class="intro">كل الخطوط دي محلية في <code>fonts/</code> ومجانية للاستخدام التجاري (رخصة OFL). اكتب جملتك علشان تشوفها بكل الخطوط.</p>
  <div class="controls">
    <input id="text" value="الخوف مش هيحميك ١٢٣">
    <select id="weight">
      <option value="400">عادي</option>
      <option value="700" selected>عريض</option>
      <option value="900">أعرض حاجة</option>
    </select>
  </div>
  <div id="groups"></div>
</main>
<script>
  const GROUPS = [
    ["عناوين قوية وجذابة", [
      ["Reem Kufi", "كوفي حديث، الخط الأساسي للعناوين"],
      ["Lalezar", "عريض ومرح، للعناوين الضخمة"],
      ["Rakkas", "عريض بلمسة كلاسيك"],
      ["Blaka", "زخرفي جريء، للافتتاحيات"],
      ["Kufam", "كوفي هندسي"],
      ["Changa", "كوفي عصري ومضغوط"],
      ["Marhey", "مرح وخفيف، للمحتوى الكوميدي"],
      ["Lemonada", "دائري ولطيف"],
    ]],
    ["نصوص وترجمة (واضحة وسهلة القراية)", [
      ["IBM Plex Sans Arabic", "الخط الأساسي للترجمة"],
      ["Cairo", "أشهر خط عربي على السوشيال ميديا"],
      ["Tajawal", "نضيف وخفيف"],
      ["Almarai", "واضح جدًا على الموبايل"],
      ["Alexandria", "حديث وأنيق"],
      ["Readex Pro", "عصري وعريض الحروف"],
      ["Baloo Bhaijaan 2", "دائري وودود"],
      ["Zain", "حديث ومتنوع الأوزان"],
      ["Noto Kufi Arabic", "كوفي محايد، أوزان كتير"],
    ]],
    ["كلاسيك وتراثي (اقتباسات، دين، تاريخ)", [
      ["Amiri", "نسخ كلاسيك، للاقتباسات والقرآن"],
      ["Noto Naskh Arabic", "نسخ واضح"],
      ["Aref Ruqaa", "رقعة، إحساس شعبي ومصري"],
      ["El Messiri", "بين الكوفي والنسخ، أنيق"],
    ]],
  ];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function render() {
    const text = esc($("text").value || " ");
    const w = $("weight").value;
    $("groups").innerHTML = GROUPS.map(([title, fonts]) => `
      <h2>${title}</h2>
      <div class="grid">${fonts.map(([f, use]) => `
        <div class="card">
          <div class="name"><b>${f}</b></div>
          <div class="sample" style="font-family:'${f}';font-weight:${w}">${text}</div>
          <div class="use">${use}</div>
        </div>`).join("")}
      </div>`).join("");
  }
  $("text").addEventListener("input", render);
  $("weight").addEventListener("input", render);
  render();
</script>
</body>
</html>
